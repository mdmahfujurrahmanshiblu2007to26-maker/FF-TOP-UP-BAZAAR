<script>

let selectedProduct = "";
let selectedPrice = 0;


function selectProduct(element,product,price){

selectedProduct = product;

selectedPrice = price;


/* Remove previous selection */

document.querySelectorAll(".product")
.forEach(function(item){

item.classList.remove("selected");

});


/* Select current product */

element.classList.add("selected");


/* Show summary */

document.getElementById("summary").style.display="block";

document.getElementById("summaryProduct")
.innerText=product;

document.getElementById("summaryPrice")
.innerText="৳"+price;

}


function placeOrder(){

let uid=document.getElementById("uid").value;

let server=document.getElementById("server").value;


if(uid===""){

alert("⚠️ প্রথমে আপনার Free Fire UID লিখুন!");

return;

}


if(selectedProduct===""){

alert("⚠️ একটি Diamond অথবা Membership নির্বাচন করুন!");

return;

}


document.getElementById("summaryUID")
.innerText=uid;

document.getElementById("summaryServer")
.innerText=server;


alert(
"✅ Demo Order তৈরি হয়েছে!\n\n"+
"UID: "+uid+"\n"+
"Server: "+server+"\n"+
"Package: "+selectedProduct+"\n"+
"Price: ৳"+selectedPrice
);

}

